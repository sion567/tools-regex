# 浏览器版构建配置（在 crates/app 目录下执行：trunk build --release）
[build]
target = "index.html"
dist = "dist"

# trunk 默认从 github 下载 wasm-bindgen（本机网络不可达）——指向本地 cargo install 的 CLI。
# 版本必须与 Cargo.lock 的 wasm-bindgen 一致（当前 0.2.130）。
# 其它机器执行前：cargo install trunk && cargo install wasm-bindgen-cli@0.2.130
# 并把下面路径改成各自的 %USERPROFILE%\.cargo\bin\wasm-bindgen.exe
[tools]
bindgen = "C:/Users/huanggang/.cargo/bin/wasm-bindgen.exe"
